services:
 postgres:
  image: postgres:16-alpine
  environment:
   POSTGRES_DB: ${POSTGRES_DB:-visitvault}
   POSTGRES_USER: ${POSTGRES_USER:-visitvault}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visitvault-local-change-me}
  volumes: [visitvault_pg:/var/lib/postgresql/data]
  healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 15}
 backend:
  build: ./backend
  env_file: .env
  depends_on: {postgres: {condition: service_healthy}}
  ports: ["4000:4000"]
 frontend:
  build: ./frontend
  environment: {VITE_API_URL: http://localhost:4000/api}
  depends_on: [backend]
  ports: ["5173:5173"]
volumes: {visitvault_pg: {}}
